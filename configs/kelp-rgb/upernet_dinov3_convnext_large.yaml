# UPerNet + DINOv3 ConvNeXt-Large for kelp-rgb.
#
# Successor to segformer_b3.yaml, which peaked at val/iou_epoch 0.714 (epoch 17
# of 80) and then declined for 30 epochs before EarlyStopping fired. Two things
# that run showed:
#
#   1. Nereo is the weak class and the failure is generalization, not capacity
#      or frequency -- nereo is 6.9% of train pixels vs macro's 3.3%, yet scores
#      train 0.810 / val 0.592 (gap 0.22) against macro's 0.889 / 0.807 (0.08).
#      Species are heavily confounded with site: 8 of 17 train mosaics are
#      single-species, so a model can score well on train by learning which site
#      it is looking at rather than which species.
#   2. The 80-epoch cosine meant the model peaked while the LR was still near
#      max, so it never annealed into a minimum.
#
# Both are addressed here: DINOv3-pretrained features for cross-site
# generalization, a schedule short enough that the anneal completes, and
# stronger photometric augmentation to break site-appearance shortcuts.
#
# Benchmarked at 1024px on an RTX 4090 (24 GB): 17.3 GB peak at batch_size 3,
# 12.4 chips/s -- less memory and faster than segformer_b3 (21.2 GB, 11.0
# chips/s) despite 4.7x the parameters, since ConvNeXt has no quadratic
# attention over the 1024x1024 grid.
#
# NOTE: layer-wise LR decay is not available for this encoder -- timm wraps it
# in a FeatureListNet with no `group_matcher`. Plain AdamW at a reduced LR is
# used instead to avoid washing out the pretrained representation.

seed_everything: 42

model:
  class_path: "hakai_ml_train.models.smp.SMPMulticlassSegmentationModel"
  init_args:
    architecture: "UPerNet"
    encoder_name: "tu-convnext_large.dinov3_lvd1689m"
    model_opts:
      encoder_weights: true
      in_channels: 3
    num_classes: 3
    ignore_index: &ignore_index -100
    optimizer_class: torch.optim.AdamW
    optimizer_opts:
      lr: 1e-4
      weight_decay: 0.03
      betas:
        - 0.9
        - 0.999
    lr_scheduler_class: hakai_ml_train.schedulers.LinearWarmupCosineDecayLR
    lr_scheduler_opts:
      warmup_steps: 500
      min_lr: 1e-6
    lr_scheduler_interval: step
    loss: "LabelSmoothingLovasz"
    loss_opts:
      mode: "multiclass"
      smoothing: 0.05
      ce_weight: 0.5
      lovasz_weight: 0.5
      ignore_index: *ignore_index
    class_names:
      - bg
      - macro
      - nereo

data:
  class_path: "hakai_ml_train.data.DataModule"
  init_args:
    # All 4330 kelp-bearing chips plus a 5k random sample of the 17803
    # background-only ones, so the model sees open water, land and glint
    # without kelp. val/test are the full, unfiltered distribution, where
    # kelp is ~3% of pixels and precision on background sets the IoU ceiling.
    # Rebuild with:
    #   python -m hakai_ml_train.prepare.make_bg_sampled_dir \
    #     <...>-1024-1024-full/train <...>-1024-1024-mixed/train --num-bg 5000
    train_chip_dir: "/home/taylor/data/KS-RGB-Jul2025-1024-1024-mixed/train"
    val_chip_dir: "/home/taylor/data/KS-RGB-Jul2025-1024-1024-full/val"
    test_chip_dir: "/home/taylor/data/KS-RGB-Jul2025-1024-1024-full/test"
    batch_size: 3
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    train_transforms:
      __version__: 2.0.8
      transform:
        __class_fullname__: Compose
        additional_targets: { }
        bbox_params: null
        is_check_shapes: true
        keypoint_params: null
        p: 1
        seed: null
        transforms:
          - __class_fullname__: D4
            p: 1.0
          # Photometric augmentation is widened relative to segformer_b3 and
          # fires more often (0.5 -> 0.6). Macro and nereo sites differ in water
          # colour, sun angle and sensor, so colour is a shortcut the model can
          # use in place of morphology -- exactly the confound behind nereo's
          # 0.22 train/val gap.
          - __class_fullname__: OneOf
            p: 0.6
            transforms:
              - __class_fullname__: RandomBrightnessContrast
                brightness_by_max: true
                brightness_limit:
                  - -0.2
                  - 0.2
                contrast_limit:
                  - -0.2
                  - 0.2
                ensure_safe_range: false
                p: 1.0
              - __class_fullname__: HueSaturationValue
                hue_shift_limit:
                  - -8.0
                  - 8.0
                p: 1.0
                sat_shift_limit:
                  - -15.0
                  - 15.0
                val_shift_limit:
                  - -20.0
                  - 20.0
          - __class_fullname__: OneOf
            p: 0.3
            transforms:
              - __class_fullname__: GaussNoise
                mean_range:
                  - 0.0
                  - 0.0
                noise_scale_factor: 1.0
                p: 1.0
                per_channel: true
                std_range:
                  - 0.02
                  - 0.044
              - __class_fullname__: ISONoise
                color_shift:
                  - 0.01
                  - 0.05
                intensity:
                  - 0.1
                  - 0.2
                p: 1.0
          - __class_fullname__: OneOf
            p: 0.3
            transforms:
              - __class_fullname__: MotionBlur
                allow_shifted: true
                angle_range:
                  - 0.0
                  - 360.0
                blur_limit:
                  - 3
                  - 7
                direction_range:
                  - -1.0
                  - 1.0
                p: 1.0
              - __class_fullname__: MedianBlur
                blur_limit:
                  - 3
                  - 7
                p: 1.0
              - __class_fullname__: GaussianBlur
                blur_limit:
                  - 0
                  - 0
                p: 1.0
                sigma_limit:
                  - 0.5
                  - 3.0
          - __class_fullname__: GridDistortion
            border_mode: 0
            distort_limit:
              - -0.1
              - 0.1
            fill: 0.0
            fill_mask: *ignore_index
            interpolation: 1
            keypoint_remapping_method: mask
            mask_interpolation: 0
            normalized: true
            num_steps: 10
            p: 0.3
          - __class_fullname__: CLAHE
            clip_limit:
              - 1.0
              - 2.0
            p: 0.1
            tile_grid_size:
              - 8
              - 8
          - __class_fullname__: ColorJitter
            brightness:
              - 0.9
              - 1.1
            contrast:
              - 0.9
              - 1.1
            hue:
              - -0.08
              - 0.08
            p: 0.4
            saturation:
              - 0.9
              - 1.1
          - __class_fullname__: Affine
            balanced_scale: false
            border_mode: 0
            fill: 0.0
            fill_mask: *ignore_index
            fit_output: false
            interpolation: 1
            keep_ratio: true
            mask_interpolation: 0
            p: 0.3
            rotate:
              - -5.0
              - 5.0
            rotate_method: largest_box
            scale:
              x:
                - 0.9
                - 1.1
              y:
                - 0.9
                - 1.1
            shear:
              x:
                - 0.0
                - 0.0
              y:
                - 0.0
                - 0.0
            translate_percent:
              x:
                - -0.05
                - 0.05
              y:
                - -0.05
                - 0.05
            translate_px: null
          - __class_fullname__: Normalize
            max_pixel_value: 255.0
            mean:
              - 0.485
              - 0.456
              - 0.406
            normalization: standard
            p: 1.0
            std:
              - 0.229
              - 0.224
              - 0.225
          - __class_fullname__: ToTensorV2
            p: 1.0
            transpose_mask: false
    test_transforms:
      __version__: 2.0.8
      transform:
        __class_fullname__: Compose
        additional_targets: { }
        bbox_params: null
        is_check_shapes: true
        keypoint_params: null
        p: 1
        seed: null
        transforms:
          - __class_fullname__: Normalize
            max_pixel_value: 255.0
            mean:
              - 0.485
              - 0.456
              - 0.406
            normalization: standard
            p: 1.0
            std:
              - 0.229
              - 0.224
              - 0.225
          - __class_fullname__: ToTensorV2
            p: 1.0
            transpose_mask: false

trainer:
  accelerator: auto
  devices: auto
  precision: bf16-mixed
  log_every_n_steps: 50
  # segformer_b3 peaked at epoch 17 of 80, so its cosine never annealed. 40
  # epochs (~9.5 h at 12.4 chips/s) puts the end of the decay near where this
  # dataset actually converges.
  max_epochs: 40
  accumulate_grad_batches: 8
  gradient_clip_val: 0.8
  detect_anomaly: false
  default_root_dir: checkpoints
  fast_dev_run: False
  logger:
    - class_path: lightning.pytorch.loggers.WandbLogger
      init_args:
        entity: hakai
        project: kom-kelp-rgb
        name: upernet_dinov3_convnext_large
        group: Jul2025
        log_model: true
        tags:
          - kelp
          - Aug2026
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        auto_insert_metric_name: False
        filename: kelp_rgb_upernet_dinov3_convnext_large_epoch-{epoch:02d}_val-iou-{val/iou_epoch:.4f}
        monitor: val/iou_epoch
        mode: max
        save_last: True
        save_top_k: 2
        save_weights_only: False
        verbose: True
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/iou_epoch
        mode: max
        patience: 15
        verbose: True
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  plugins:
    - class_path: lightning.pytorch.plugins.io.AsyncCheckpointIO
